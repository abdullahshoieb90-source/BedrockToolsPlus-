name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - id: buildstep
        name: Build and package
        run: |
          set +e
          ndkpath=${{ steps.ndk.outputs.ndk-path }}
          echo "::warning file=build.yml::BTP-M0 script started ndk=${ndkpath:0:40}"
          free -m > /tmp/btp-mem-before.txt 2>&1
          df -h / >> /tmp/btp-mem-before.txt 2>&1
          echo "::warning file=build.yml::BTP-M1 configure starting"
          xmake f -y -p android -a arm64-v8a -m release --ndk=$ndkpath > /tmp/btp-configure.log 2>&1
          configure_code=$?
          free -m > /tmp/btp-mem-mid.txt 2>&1
          df -h / >> /tmp/btp-mem-mid.txt 2>&1
          echo "::warning file=build.yml::BTP-M2 configure done code=$configure_code"
          echo "::warning file=build.yml::BTP-M3 build starting (j2)"
          xmake -y -j2 > /tmp/btp-build.log 2>&1
          build_code=$?
          free -m > /tmp/btp-mem-after.txt 2>&1
          df -h / >> /tmp/btp-mem-after.txt 2>&1
          echo "::warning file=build.yml::BTP-M4 build done code=$build_code"
          if [ "$configure_code" -eq 0 ] && [ "$build_code" -eq 0 ]; then
            exit 0
          fi
          echo "::error file=build.yml::BTP-M5 failure branch configure=$configure_code build=$build_code"
          if [ "$configure_code" -ne 0 ]; then
            tail -n 80 /tmp/btp-configure.log | while IFS= read -r line; do
              echo "::error file=btp-configure.log::L: $line"
            done
          fi
          if [ "$build_code" -ne 0 ]; then
            tail -n 80 /tmp/btp-build.log | while IFS= read -r line; do
              echo "::error file=btp-build.log::L: $line"
            done
          fi
          {
            echo "### BedrockToolsPlus build failed (configure=$configure_code build=$build_code)"
            if [ "$configure_code" -ne 0 ]; then
              echo ""
              echo "<details open><summary>configure log (last 150 lines)</summary>"
              echo '```'
              tail -n 150 /tmp/btp-configure.log
              echo '```'
              echo "</details>"
            fi
            if [ "$build_code" -ne 0 ]; then
              echo ""
              echo "<details open><summary>build log (last 150 lines)</summary>"
              echo '```'
              tail -n 150 /tmp/btp-build.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          git config user.email "btp-diag@users.noreply.github.com"
          git config user.name "btp-diag"
          git checkout -B btp-diag-log 2>&1 | tail -1
          {
            echo "head_sha=$GITHUB_SHA"
            echo "configure_code=$configure_code build_code=$build_code"
            echo "---- mem before ----"; cat /tmp/btp-mem-before.txt
            echo "---- mem mid ----"; cat /tmp/btp-mem-mid.txt
            echo "---- mem after ----"; cat /tmp/btp-mem-after.txt
            echo "---- configure log ----"; cat /tmp/btp-configure.log
            echo "---- build log ----"; cat /tmp/btp-build.log
          } > ci-diag-build.log
          git add ci-diag-build.log
          git commit -m "btp build diag $GITHUB_SHA" -q
          echo "::warning file=build.yml::BTP-M6 pushing diag branch"
          git push -f origin HEAD:btp-diag-log 2>&1 | tail -2
          if [ "$configure_code" -ne 0 ]; then
            exit "$configure_code"
          fi
          exit "$build_code"

      - uses: actions/upload-artifact@v5
        with:
          name: BedrockToolsPlus-levipack
          path: build/android/arm64-v8a/release/BedrockToolsPlus.levipack
          if-no-files-found: error
