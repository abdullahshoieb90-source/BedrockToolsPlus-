name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - id: buildstep
        name: Build and package
        run: |
          set +e
          ndkpath=${{ steps.ndk.outputs.ndk-path }}
          echo "$$" > /tmp/btp-main-pid
          rm -f /tmp/btp-stop-watchdog /tmp/btp-dump-requested /tmp/btp-watchdog.log /tmp/btp-configure-code /tmp/btp-build-code
          echo '' | base64 -d > /tmp/btp-watchdog.sh
          chmod +x /tmp/btp-watchdog.sh
          setsid /tmp/btp-watchdog.sh </dev/null >/dev/null 2>&1 &
          echo "::warning file=build.yml::BTP-M0 script started pid=$$ ndk=${ndkpath:0:40}"

          echo "::warning file=build.yml::BTP-M1 configure starting"
          xmake f -y -p android -a arm64-v8a -m release --ndk=$ndkpath > /tmp/btp-configure.log 2>&1
          configure_code=$?
          echo "$configure_code" > /tmp/btp-configure-code
          free -m > /tmp/btp-mem-mid.txt 2>&1
          df -h / >> /tmp/btp-mem-mid.txt 2>&1
          echo "::warning file=build.yml::BTP-M2 configure done code=$configure_code"

          echo "::warning file=build.yml::BTP-M3 build starting (j2)"
          xmake -y -j2 > /tmp/btp-build.log 2>&1
          build_code=$?
          echo "$build_code" > /tmp/btp-build-code
          free -m > /tmp/btp-mem-after.txt 2>&1
          df -h / >> /tmp/btp-mem-after.txt 2>&1
          echo "::warning file=build.yml::BTP-M4 build done code=$build_code"

          if [ "$configure_code" -eq 0 ] && [ "$build_code" -eq 0 ]; then
            touch /tmp/btp-stop-watchdog
            exit 0
          fi

          echo "::error file=build.yml::BTP-M5 failure branch configure=$configure_code build=$build_code"
          if [ "$configure_code" -ne 0 ]; then
            tail -n 60 /tmp/btp-configure.log | while IFS= read -r line; do
              echo "::error file=btp-configure.log::L: $line"
            done
          fi
          if [ "$build_code" -ne 0 ]; then
            tail -n 60 /tmp/btp-build.log | while IFS= read -r line; do
              echo "::error file=btp-build.log::L: $line"
            done
          fi
          touch /tmp/btp-dump-requested
          sleep 50
          touch /tmp/btp-stop-watchdog
          if [ "$configure_code" -ne 0 ]; then
            exit "$configure_code"
          fi
          exit "$build_code"

      - uses: actions/upload-artifact@v5
        with:
          name: BedrockToolsPlus-levipack
          path: build/android/arm64-v8a/release/BedrockToolsPlus.levipack
          if-no-files-found: error
