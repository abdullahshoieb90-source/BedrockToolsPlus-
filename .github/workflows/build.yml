name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
          xmake -y

      # The preloader loads the mod with dlopen(RTLD_NOW): one undefined symbol
      # and the whole library fails to load, which makes *every* module
      # disappear from the launcher menu. The build itself does not notice, so
      # the shared object is inspected before it is packaged as an artifact.
      - name: Check for symbols that cannot resolve
        run: |
          LIB=$(find build/android -name libBedrockToolsPlus.so | head -n1)
          test -n "$LIB" || { echo "libBedrockToolsPlus.so not found"; exit 1; }
          python3 scripts/check_undefined_symbols.py "$LIB"

      - uses: actions/upload-artifact@v5
        with:
          name: BedrockToolsPlus-levipack
          path: build/android/arm64-v8a/release/BedrockToolsPlus.levipack
          if-no-files-found: error
