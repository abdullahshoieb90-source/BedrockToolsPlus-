name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          set +e
          {
            xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }}
            xmake -y
          } 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              grep -Ei "error:|fatal|undefined reference|failed|exception" build.log || true
              tail -n 8 build.log
            } | sed -r 's/\x1B\[[0-9;]*[mK]//g' | tail -n 40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit "$status"
          fi

      - name: Run host C++ tests
        run: ./scripts/run_tests.sh

      - name: Test voice relay
        run: python3 -m unittest -v tests/test_voicechat_relay.py

      - uses: actions/upload-artifact@v5
        with:
          name: BedrockToolsPlus-levipack
          path: build/android/arm64-v8a/release/BedrockToolsPlus.levipack
          if-no-files-found: error
